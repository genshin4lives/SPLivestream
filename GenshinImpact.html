<!DOCTYPE html>
<html>
<head>
<style type="text/css">
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/

html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}

body,html {
  overflow: hidden;
}
.box {
    float:left;
    width: 50%;
	height: 50vh;
	margin: 0;
	padding: 0;
	border: 0;
}
iframe {
	border: 0px;
    width: 50vw;
	height: 50vh;
}
</style>
<title>《原神》前瞻直播用</title>
</head>
<body>

<div class="box">
	<!-- B站 -->
	<iframe width="854" height="480" src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=21987615&quality=0&danmaku=1" title="Bilibili Live" frameborder="0" allowfullscreen></iframe>
</div>
<div class="box">
	<!-- Twitch -->
	<iframe id="Fgenshinimpactofficial" src="" frameborder="0" allowfullscreen="true" scrolling="no" height="378" width="620"></iframe>
	<script>
		document.getElementById("Fgenshinimpactofficial").src = "https://player.twitch.tv/?channel=genshinimpactofficial&parent="+  location.host;
	</script>
</div>
<div class="box">
	<!-- YT日 -->
	<iframe id="ytjpFrame" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
</div>
<div class="box">
	<!-- YT韓 -->
	<iframe id="ytkrFrame" height="315" width="560" src="" frameborder="0" allowfullscreen></iframe>
</div>

<script>
function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

// 預設影片 ID
//https://www.youtube.com/@Genshin_JP/streams
//https://www.youtube.com/@Genshinimpact_KR/streams
const defaultYtjp = "BNIomgSPGtU";
const defaultYtkr = "lll5ojvoGbM";

// 取得網址參數
//https://genshin4lives.github.io/SPLivestream/GenshinImpact.html?ytjp=BNIomgSPGtU&ytkr=BNIomgSPGtU
const ytjpId = getQueryParam("ytjp") || defaultYtjp;
const ytkrId = getQueryParam("ytkr") || defaultYtkr;

// 設定 iframe 來源
document.getElementById("ytjpFrame").src = `https://www.youtube.com/embed/${ytjpId}?autoplay=1&disablekb=1&mute=1`;
document.getElementById("ytkrFrame").src = `https://www.youtube.com/embed/${ytkrId}?autoplay=1&disablekb=1&mute=1`;

function reloadAtEightPMUTC8() {
    const now = new Date();
    const eightPMUTC8 = new Date();
    eightPMUTC8.setUTCHours(12, 0, 0, 0); // UTC+8 的晚上 8 點等於 UTC 的中午 12 點

    if (now.getTime() > eightPMUTC8.getTime()) {
        eightPMUTC8.setDate(eightPMUTC8.getDate() + 1);
    }

    const timeUntilEightPMUTC8 = eightPMUTC8.getTime() - now.getTime();

    setTimeout(() => {
        window.location.reload();
        reloadAtEightPMUTC8(); // 設置下一次重新整理
    }, timeUntilEightPMUTC8);
}

reloadAtEightPMUTC8();
</script>
</body>
</html>
