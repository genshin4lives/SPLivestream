<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style type="text/css">
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/

html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
    margin: 0;
    padding: 0;
    border: 0;
    font-size: 100%;
    font: inherit;
    vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
    display: block;
}
body {
    line-height: 1;
}
ol, ul {
    list-style: none;
}
blockquote, q {
    quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
    content: '';
    content: none;
}
table {
    border-collapse: collapse;
    border-spacing: 0;
}

/* 響應式設計樣式 */
body, html {
    width: 100%;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* 使用 Flexbox 的容器 */
.container {
    display: flex;
    flex-wrap: wrap; /* 允許換行 */
    justify-content: center; /* 水平置中 */
    gap: 10px; /* 區塊之間的間距 */
    max-width: 1500px; /* 最大寬度限制為 3 * 500px */
    margin: 0 auto; /* 整體置中 */
}

.box {
    flex: 1; /* 均分寬度 */
    min-width: 300px; /* 最小寬度，防止過窄 */
    max-width: 500px; /* 最大寬度限制 */
    margin: 10px 0; /* 上下間距 */
    box-sizing: border-box;
    overflow-y: auto; /* 啟用垂直卷軸 */
}

/* iframe 和 Twitter 嵌入的基本樣式 */
iframe, .twitter-timeline {
    width: 100%;
    height: 800px !important; /* 強制高度為 800px */
    border: none;
    overflow-y: scroll; /* 啟用垂直卷軸 */
    overflow-x: hidden; /* 隱藏水平卷軸 */
}

</style>
<title>《原神》公告用</title>
</head>
<body>

<div class="container">
    <div class="box">
        <iframe src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FGenshinimpact.tw&tabs=timeline&width=500&height=800&small_header=true&adapt_container_width=true&hide_cover=false&show_facepile=false&appId=247166874108" width="100%" height="800" style="border:none; overflow-y: scroll; overflow-x: hidden;" scrolling="yes" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
    </div>
    <div class="box">
        <iframe src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FGenshinimpact&tabs=timeline&width=500&height=800&small_header=true&adapt_container_width=true&hide_cover=false&show_facepile=false&appId=247166874108" width="100%" height="800" style="border:none; overflow-y: scroll; overflow-x: hidden;" scrolling="yes" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
    </div>
    <div class="box">
        <a class="twitter-timeline" href="https://twitter.com/Genshin_7?ref_src=twsrc%5Etfw">Tweets by Genshin_7</a> <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    </div>
</div>

</body>
</html>
